[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opamp-cli"
version = "0.1.0"
description = "Prompt-driven command generator and runner for OpAMP local workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Phil Wilkins", email = "phil-AT-mp3monster.org" }]
keywords = ["opamp", "observability", "cli", "tooling", "orchestration"]
dependencies = [
  "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
  "pylint>=3.0",
  "pytest>=8.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.0",
]

[project.scripts]
opamp-cli = "opamp_cli.main:main"

[project.urls]
Repository = "https://github.com/mp3monster/fluent-opamp"
Homepage = "https://htmlpreview.github.io/?https://raw.githubusercontent.com/mp3monster/fluent-opamp/main/github-landingpage/index.html"
Blog = "https://blog.mp3monster.org/category/technology/fluent-observability/opamp/"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
opamp_cli = ["version.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
  "-s",
  "--cov=opamp_cli",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-branch",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["opamp_cli"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["opamp_cli"]
