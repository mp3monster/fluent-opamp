[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opamp-broker"
version = "0.4.1"
description = "OpAMP conversation broker package for standalone wheel deployment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "mp3monster.org" }]
keywords = ["opamp", "observability", "broker", "chatops", "automation"]
dependencies = [
  "quart>=0.19",
  "slack-bolt>=1.20.1",
  "aiohttp>=3.9.0",
  "langgraph>=0.2.40",
  "langchain-core>=0.3.18",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp",
  "opentelemetry-instrumentation-asgi",
  "opentelemetry-instrumentation-logging",
  "pydantic>=2.9.2",
  "httpx>=0.27.2",
  "python-dotenv>=1.0.1",
  "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pylint>=3.0",
  "pytest>=8.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.0",
]

[project.scripts]
opamp-broker = "opamp_broker.broker_app:run"

[project.urls]
Repository = "https://github.com/mp3monster/fluent-opamp"
Homepage = "https://htmlpreview.github.io/?https://raw.githubusercontent.com/mp3monster/fluent-opamp/main/github-landingpage/index.html"
Blog = "https://blog.mp3monster.org/category/technology/fluent-observability/opamp/"

[tool.pytest.ini_options]
addopts = [
  "-s",
  "--cov=opamp_broker",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-branch",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["opamp_broker"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["opamp_broker", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["opamp_broker"]

[tool.hatch.build.targets.wheel]
packages = ["opamp_broker"]
include = ["opamp_broker/config/*.json", "opamp_broker/*.json"]

[tool.hatch.build.targets.sdist]
include = [
  "README.md",
  "requirements.txt",
  "opamp_broker/**",
  "scripts/**",
  "docs/**",
]
