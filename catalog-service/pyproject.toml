[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-service"
version = "0.1.0"
description = "Standalone OpAMP configuration catalog backend and UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "quart>=0.20.0",
]

[project.scripts]
catalog-service = "catalog_service.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
catalog_service = ["config/*.json", "html/*.html", "html/*.css", "html/*.png"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["catalog_service"]
