[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-service"
version = "0.4.0"
description = "Standalone OpAMP configuration catalog backend and UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["opamp", "observability", "catalog", "configuration", "ui"]
dependencies = [
  "quart>=0.20.0",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp",
  "opentelemetry-instrumentation-asgi",
  "opentelemetry-instrumentation-logging"
]

[project.optional-dependencies]
dev = [
  "pylint>=3.0",
  "pytest>=8.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.0",
]

[project.scripts]
catalog-service = "catalog_service.app:main"

[project.urls]
Repository = "https://github.com/mp3monster/fluent-opamp"
Homepage = "https://htmlpreview.github.io/?https://raw.githubusercontent.com/mp3monster/fluent-opamp/main/github-landingpage/index.html"
Blog = "https://blog.mp3monster.org/category/technology/fluent-observability/opamp/"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
catalog_service = ["config/*.json", "html/*.html", "html/*.css", "html/*.png"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
  "-s",
  "--cov=catalog_service",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-branch",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["catalog_service"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["catalog_service"]
