# Default Fluent Bit config used when AGENT_CONFIG_PATH is not provided.

service:
  flush: 2
  log_level: info
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020

pipeline:
  inputs:
    - name: dummy
      dummy: '{"hello":"world"}'
      tag: dummy

    - name: http
      listen: 0.0.0.0
      port: 8888

  outputs:
    - name: file
      match: "*"
      file: __OUTPUT_DIR__/fluent-bit.out
      format: out_file
