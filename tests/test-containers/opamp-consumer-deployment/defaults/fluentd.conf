# Default Fluentd config used when AGENT_CONFIG_PATH is not provided.

<system>
  log_level info
</system>

<source>
  @type monitor_agent
  bind 0.0.0.0
  port 2020
</source>

<source>
  @type dummy
  tag dummy
  auto_increment_key counter
  dummy {"hello":"world"}
</source>

<match *>
  @type file
  path __OUTPUT_DIR__/fluentd.out
</match>
