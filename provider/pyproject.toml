[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opamp-server"
version = "0.4.0"
description = "OpAMP Server - upstream source https://github.com/mp3monster/fluent-opamp "
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Phil Wilkins" }]
keywords = ["opamp", "observability", "otel", "server", "control-plane"]
dependencies = [
  "quart>=0.19",
  "pydantic>=2.6",
  "protobuf>=5.27",
  "grpcio-tools>=1.60",
  "fastmcp>=2.0",
  "PyJWT>=2.8",
  "lark>=1.2.2",
  "luaparser>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "pylint>=3.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.0",
]

[project.scripts]
opamp-provider = "opamp_provider.server:main"

[project.urls]
Repository = "https://github.com/mp3monster/fluent-opamp"
Homepage = "https://htmlpreview.github.io/?https://raw.githubusercontent.com/mp3monster/fluent-opamp/main/github-landingpage/index.html"
Blog = "https://blog.mp3monster.org/category/technology/fluent-observability/opamp/"

[tool.pytest.ini_options]
addopts = [
  "-s",
  "--cov=opamp_provider",
  "--cov=shared",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-branch",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["opamp_provider", "shared"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["opamp_provider", "shared"]

[tool.hatch.build.targets.wheel]
packages = ["src/opamp_provider", "src/shared"]
include = [
  "src/opamp_provider/provider_logging.json",
  "src/opamp_provider/version.json",
]

[tool.hatch.build.targets.wheel.force-include]
"../docs" = "docs"
"../scripts" = "scripts"
"../mcp" = "mcp"

[tool.hatch.build.hooks.custom]
