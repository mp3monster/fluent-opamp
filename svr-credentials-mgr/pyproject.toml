[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svr-credentials-manager-service"
version = "0.1.0"
description = "Manage named OpAMP server-to-agent connection credentials."
readme = "readme.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Phil Wilkins" }]
keywords = ["opamp", "credentials", "keyring", "connection-settings"]
dependencies = ["keyring>=25.0", "keyrings.cryptfile>=1.3", "protobuf>=5.27", "quart>=0.19.4"]

[project.optional-dependencies]
dev = ["pylint>=3.0", "pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=7.0.0", "ruff>=0.15.0"]

[project.scripts]
svr-credentials-manager-service = "svr_credentials_manager_service.app:main"

[project.urls]
Repository = "https://github.com/mp3monster/fluent-opamp"
Homepage = "https://htmlpreview.github.io/?https://raw.githubusercontent.com/mp3monster/fluent-opamp/main/github-landingpage/index.html"
Blog = "https://blog.mp3monster.org/category/technology/fluent-observability/opamp/"

[tool.setuptools]
package-dir = { "" = "src", opamp_plaintext_keyring = "plaintext-keyring/src/opamp_plaintext_keyring" }

[tool.setuptools.packages.find]
where = ["src", "plaintext-keyring/src"]

[tool.setuptools.package-data]
svr_credentials_manager_service = ["html/*", "config/*.json"]

[tool.pytest.ini_options]
addopts = ["-s", "--cov=svr_credentials_manager_service", "--cov=connection_settings_builder", "--cov-report=term-missing", "--cov-report=xml:coverage.xml", "--cov-branch"]
testpaths = ["tests", "plaintext-keyring/tests"]

[tool.coverage.run]
branch = true
source = ["svr_credentials_manager_service", "connection_settings_builder"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["connection_settings_builder", "svr_credentials_manager_service"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["S101"]
