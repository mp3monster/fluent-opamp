[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opamp-consumer"
version = "0.4.0"
description = "OpAMP client (as a supervisor) designed primarily for Fluent Bit & Fluentd  using Quart transport semantics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Phil Wilkins" }]
keywords = ["opamp", "observability", "agent", "consumer", "supervisor"]
dependencies = [
  "defusedxml>=0.7.1",
  "protobuf>=5.27",
  "grpcio-tools>=1.60",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "websockets>=12.0",
  "psutil>=5.9",
  "uuid_v7>=0.1",
]

[project.optional-dependencies]
dev = [
  "pylint>=3.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.0",
]

[project.scripts]
opamp-consumer = "opamp_consumer.client:main"
opamp-consumer-fluentd = "opamp_consumer.fluentd_client:main"
opamp-consumer-simulator = "opamp_consumer.simulator_client:main"

[project.urls]
Repository = "https://github.com/mp3monster/fluent-opamp"
Homepage = "https://htmlpreview.github.io/?https://raw.githubusercontent.com/mp3monster/fluent-opamp/main/github-landingpage/index.html"
Blog = "https://blog.mp3monster.org/category/technology/fluent-observability/opamp/"

[tool.pytest.ini_options]
addopts = [
  "-s",
  "--cov=opamp_consumer",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-branch",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["opamp_consumer"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["opamp_consumer"]

[tool.hatch.build.targets.wheel]
packages = ["src/opamp_consumer"]
include = [
  "src/opamp_consumer/consumer_logging.json",
  "src/opamp_consumer/version.json",
]
