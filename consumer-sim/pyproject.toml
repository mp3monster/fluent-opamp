[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opamp-consumer-sim"
version = "0.4.0"
description = "Standalone multi-instance launcher for OpAMP consumer simulator processes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Phil Wilkins" }]
keywords = ["opamp", "consumer", "simulator", "launcher", "testing"]
dependencies = [
  "jsonschema>=4.0",
  "opamp-consumer>=0.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.0",
]

[project.scripts]
opamp-consumer-sim = "consumer_sim_launcher:main"

[project.urls]
Repository = "https://github.com/mp3monster/fluent-opamp"
Homepage = "https://htmlpreview.github.io/?https://raw.githubusercontent.com/mp3monster/fluent-opamp/main/github-landingpage/index.html"
Blog = "https://blog.mp3monster.org/category/technology/fluent-observability/opamp/"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["component_version", "consumer_sim_launcher"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opamp_consumer_sim = [
  "config/*.json",
  "version.json",
]

[tool.pytest.ini_options]
addopts = [
  "-s",
  "--cov=consumer_sim_launcher",
  "--cov=component_version",
  "--cov=opamp_consumer_sim",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-branch",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["consumer_sim_launcher", "component_version", "opamp_consumer_sim"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["component_version", "consumer_sim_launcher", "opamp_consumer_sim"]
